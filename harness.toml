# dinner-harness manifest — single source of truth for the custom Claude Code / Codex harness.
# Read by adapters/*.py (stdlib tomllib only). Hand-edit the canonical tree, then
# `py -3 install.py --target claude` regenerates ~/.claude. See README.md.

[meta]
name = "dinner-harness"
description = "Custom harness: tool-neutral content/ + claude-native assets/claude/, installed per target."

[vars]
# Tokens used inside templated source files; the adapter substitutes the real value
# at install time. username_token from the install environment / --username;
# claude_home_token from the install dest (drive + path), so hook command paths are
# not pinned to C: and follow a custom --dest.
username_token = "<USERNAME>"
claude_home_token = "<CLAUDE_HOME>"

[targets.claude]
# Directories shared with another tool. Leftovers under them are advisory-only;
# other manifest-owned directory leftovers remain exit-code-affecting.
shared_dirs = []

# Subtrees inside owned dirs that a vendor runtime manages (Claude desktop syncs
# account skills into skills/synced/). check.py skips them in the leftover scan.
vendor_dirs = ["skills/synced"]

# Verbatim copies. Each entry: [src (repo-relative), dest (target-root-relative)].
# src may be a file or a directory (recursive). Directories honor the exclude lists below.
# The Claude target is a 1-CLI install (ADR-0023 addendum): headless/Two-CLI
# infrastructure is not installed here. The orchestrator, routing.toml, roles and
# two-cli/routing references stay for the Codex target; the delegate skill, _mode
# reminders and HANDOFF/RESULT templates are now source-only (no target installs them).
copy = [
  ["content/rules/agent-routing.md",      "rules/agent-routing.md"],
  ["content/rules/autonomy-policy.md",    "rules/autonomy-policy.md"],
  ["content/skills",                      "skills"],
  ["content/agents",                      "agents"],
  ["content/templates",                   "templates"],
  ["content/ecc-reference",               "ecc-reference"],
  ["content/docs",                        "docs"],
  ["assets/claude/hooks",                 "hooks"],
  ["assets/claude/MCP-UNREAL-SETUP.md",   "MCP-UNREAL-SETUP.md"],
  ["assets/claude/settings.json.template", "settings.json.template"],
  ["assets/claude/gitignore",             ".gitignore"],
]

# Dest paths (file or directory, target-root-relative) pruned from bulk copies.
drop_dests = ["skills/delegate"]

# Paths earlier manifests installed outside owned dirs. check.py reports any that still
# exist as blocking leftovers (rules/*.md would keep auto-loading); nothing deletes them.
# Leftovers inside owned dirs (skills/delegate, hooks/*builder_guard*) are already caught.
retired_dests = [
  "rules/two-cli-reference.md", "rules/routing-reference.md", "rules/_mode",
  "roles", "orchestrate.py", "orchestrator", "routing.toml",
  "HANDOFF.md", "RESULT.md",
  "claude-direct.cmd", "dh.cmd", "dh-architect.cmd", "watch-builder.ps1",
]

# Generated by variable substitution. The adapter replaces `username_token` with the
# real username and, for JSON dests, drops `strip_keys` (machine/runtime-only fields).
# Inline-table array so these stay direct keys of [targets.claude] regardless of order.
template = [
  { src = "assets/claude/settings.json.template", dest = "settings.json", strip_keys = ["_template"], merge = true },
  { src = "content/instructions/CLAUDE.md", dest = "CLAUDE.md" },
  { src = "assets/claude/README.md", dest = "README.md" },
]

# Directory basenames and file suffixes pruned from every copy AND from the
# lossless-diff comparison: runtime/cache artifacts that are not harness content.
exclude_dir_names = ["__pycache__", "logs", "_staging", "tests"]
exclude_file_suffixes = [".pyc", ".pyo", ".pyd"]

[targets.codex]
# Codex inline workflow, native custom agents and supported command hooks.
# Rules/roles are explicit references; copying them does not auto-inject them.
shared_dirs = ["agents", "skills"]

copy = [
  ["orchestrate.py",           "orchestrate.py"],
  ["orchestrator",             "orchestrator"],
  ["content/ecc-reference",   "ecc-reference"],
  ["content/docs",            "docs"],
  ["content/templates",       "templates"],
  ["content/rules/agent-routing.md", "rules/agent-routing.md"],
  ["content/rules/autonomy-policy.md", "rules/autonomy-policy.md"],
  ["content/rules/routing-reference.md", "rules/routing-reference.md"],
  ["content/rules/two-cli-reference.md", "rules/two-cli-reference.md"],
  ["content/roles", "roles"],
]

template = [
  { src = "assets/codex/AGENTS.md", dest = "AGENTS.md" },
]

# routing.toml is rendered, not copied: the source default preset is claude_only
# (ADR-0023), but a Codex-only machine must resolve to codex_only without a
# Claude CLI. Only the [routing].preset line differs from the source.
routing_src = "content/routing.toml"
routing_dest = "routing.toml"
routing_preset = "codex_only"

# Neutral skill bodies retain engine reference entry points and optional review.
# delegate is source-only: neither target installs it (ADR-0023 addendum).
skills_src = "content/skills"
skills_dest = "skills"
skills_drop = ["delegate"]
required_references = [
  "rules/agent-routing.md", "rules/autonomy-policy.md",
  "rules/routing-reference.md", "rules/two-cli-reference.md",
  "roles/ROLE_ARCHITECT.md", "roles/ROLE_BUILDER.md",
  "skills/verification-loop/SKILL.md", "skills/adversarial-review/SKILL.md",
  "docs/specialists/ue-gas.md", "docs/specialists/ue-blueprint.md",
  "docs/specialists/ue-replication.md", "docs/specialists/ue-umg.md",
  "docs/specialists/unity-dots.md", "docs/specialists/unity-ui.md",
  "docs/specialists/unity-addressables.md", "docs/specialists/unity-shader.md",
]

# Codex 0.140+ native hooks. Copy only the portable Python implementation;
# Claude launchers are intentionally excluded because they point at ~/.claude.
hooks_copy = [
  ["assets/claude/hooks/handlers", "hooks/handlers"],
  ["assets/claude/hooks/lib",      "hooks/lib"],
  ["assets/claude/hooks/rules",    "hooks/rules"],
  ["assets/claude/hooks/README.md", "hooks/README.md"],
]
hooks_json = true

# Codex 0.140+ custom agents. Markdown frontmatter/body is converted to
# ~/.codex/agents/*.toml by adapters/codex.py.
agents_src = "content/agents"
agents_dest = "agents"

exclude_dir_names = ["__pycache__", "logs", "_staging", "tests"]
exclude_file_suffixes = [".pyc", ".pyo", ".pyd"]
