# dinner-harness routing config — the ONLY place concrete model/vendor/effort
# policy lives (backend vendor identifiers remain valid in code).
# orchestrator/routing.py reads this file; it never falls back to a hardcoded
# mapping if this file is missing or invalid — that failure is intentional
# (ADR-0020 correction 1). Changing a concrete model here should never require
# changing controller.py, HANDOFF format, or risk policy.
#
# Logical roles (must match exactly what orchestrator/controller.py dispatches):
#   architect        — interactive-session recommended policy (primary path);
#                       not applied by legacy experimental `run`. NOT dispatched by
#                       the primary `orchestrate.py build` path, which runs
#                       inside the user's own already-running interactive
#                       Codex or Claude session.
#   challenger_high  — read-only HIGH-risk ADR/HANDOFF challenge (dispatch-controlled).
#   builder_low      — dispatch-controlled, compute tier LOW.
#   builder_normal   — dispatch-controlled, compute tier NORMAL.
#   builder_high     — dispatch-controlled, compute tier HIGH (or any risk=HIGH gate).
#   reviewer         — interactive-session recommended policy (primary path);
#                       native reviewer agents also use this policy; legacy run does not.
#
# Codex builder cost tiers (default and hybrid) share the policy documented in
# ADR-0020's 2026-09-11 addendum. Risk/review gates remain independent of compute.

[routing]
preset = "codex_only"

[native_agents]
architect = "architect"
planner = "architect"
code-reviewer = "reviewer"
cpp-reviewer = "reviewer"
tdd-guide = "reviewer"
performance-analyst = "reviewer"
cpp-build-resolver = "builder_normal"
gameplay-programmer = "builder_normal"
network-programmer = "builder_normal"
tools-programmer = "builder_normal"
ui-programmer = "builder_normal"
unity-specialist = "builder_normal"
unreal-specialist = "builder_normal"

[presets.hybrid.vendor_fallbacks]
codex = "codex_only"
claude = "claude_only"

[presets.claude_only.vendor_fallbacks]
codex = "codex_only"

[presets.codex_only.vendor_fallbacks]
claude = "claude_only"

# --- hybrid: Claude reasoning with Codex implementation ----------------- #
# Claude for high-leverage reasoning (Architect/Challenger/Reviewer), Codex
# for token-heavy implementation (Builder). See ADR-0020 for the token-economy
# rationale this mirrors from content/instructions/CLAUDE.md's cross-vendor
# role assignment.

[presets.hybrid.architect]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"

[presets.hybrid.challenger_high]
vendor = "claude"
model = "claude-opus-5"
effort = "low"

[presets.hybrid.builder_low]
vendor = "codex"
model = "gpt-6-luna"
effort = "medium"

[presets.hybrid.builder_normal]
vendor = "codex"
model = "gpt-6-sol"
effort = "medium"

[presets.hybrid.builder_high]
vendor = "codex"
model = "gpt-6-astra"
effort = "high"

[presets.hybrid.reviewer]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"

# --- claude_only: no Codex in the loop ----------------------------------- #
# Same role boundaries as hybrid (Architect/Challenger/Builder/Reviewer stay
# separate, independent invocations — not single-agent mode), all resolved to
# Claude models. Builder strength still scales with compute tier.

[presets.claude_only.architect]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"

[presets.claude_only.challenger_high]
vendor = "claude"
model = "claude-opus-5"
effort = "low"

[presets.claude_only.builder_low]
vendor = "claude"
model = "claude-sonnet-5"
effort = "low"

[presets.claude_only.builder_normal]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"

[presets.claude_only.builder_high]
vendor = "claude"
model = "claude-opus-5"
effort = "low"

[presets.claude_only.reviewer]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"

# --- codex_only: default, no Claude Code in the loop ---
# Independent HIGH Challenger; Luna/Sol/Astra scale delegated compute by tier.
# Safety gates are unchanged.

[presets.codex_only.architect]
vendor = "codex"
model = "gpt-6-astra"
effort = "medium"

[presets.codex_only.challenger_high]
vendor = "codex"
model = "gpt-6-astra"
effort = "high"

[presets.codex_only.builder_low]
vendor = "codex"
model = "gpt-6-luna"
effort = "medium"

[presets.codex_only.builder_normal]
vendor = "codex"
model = "gpt-6-sol"
effort = "medium"

[presets.codex_only.builder_high]
vendor = "codex"
model = "gpt-6-astra"
effort = "high"

[presets.codex_only.reviewer]
vendor = "codex"
model = "gpt-6-sol"
effort = "high"
